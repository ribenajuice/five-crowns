AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub Actions OIDC deploy role for one repository. Lets the repo's
  workflows assume an AWS role with short-lived credentials - no stored keys.
  Deployed by scripts/aws-bootstrap.sh.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub username or org (e.g. ribenajuice)
  RepositoryName:
    Type: String
    Description: Repository name (without org)
  OIDCProviderArn:
    Type: String
    Default: ""
    Description: Existing GitHub OIDC provider ARN. Leave empty to create one (only one per AWS account is allowed).
  SubjectPrefix:
    Type: String
    AllowedPattern: "^repo:[^:]+$"
    Description: >-
      The OIDC subject prefix exactly as GitHub sends it for this repo, e.g.
      repo:owner@123/repo@456 (immutable format) or repo:owner/repo (classic).
      scripts/aws-bootstrap.sh reads it from GitHub's API; never type it by hand.

Conditions:
  CreateOIDCProvider: !Equals [!Ref OIDCProviderArn, ""]

Resources:
  GithubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub github-deploy-${RepositoryName}
      Description: !Sub Assumed by GitHub Actions in ${GitHubOrg}/${RepositoryName} for deploys
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If
                - CreateOIDCProvider
                - !Ref GithubOidc
                - !Ref OIDCProviderArn
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Exactly one subject: a job in this repo that declares
                # `environment: production` (.github/workflows/deploy.yml).
                # No other branch, pull request, fork or repo can assume this.
                #
                # For such a job GitHub puts the ENVIRONMENT in the subject,
                # not the branch - so the branch gate is the production
                # environment's deployment-branch policy (main only), which
                # scripts/aws-bootstrap.sh sets. Without that policy, any
                # branch whose workflow names the environment would match.
                #
                # SubjectPrefix is read from GitHub by aws-bootstrap.sh, never
                # typed: this repo uses GitHub's IMMUTABLE subject format,
                # `repo:<owner>@<owner-id>/<repo>@<repo-id>`, so a renamed,
                # deleted-and-recreated or transferred repo can never match.
                # The classic `repo:<owner>/<repo>` form silently fails here
                # with "Not authorized to perform sts:AssumeRoleWithWebIdentity".
                token.actions.githubusercontent.com:sub: !Sub ${SubjectPrefix}:environment:production
      Policies:
        - PolicyName: serverless-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Broad enough for common serverless stacks (CDK/SST/SAM: S3 +
              # CloudFront + Lambda + DynamoDB). The devops-engineer agent
              # should tighten this to the project's actual footprint after
              # the first deploy.
              - Sid: Infra
                Effect: Allow
                Action:
                  - cloudformation:*
                  - s3:*
                  - cloudfront:*
                  - lambda:*
                  - apigateway:*
                  - dynamodb:*
                  - logs:*
                  - ssm:GetParameter*
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                  - ssm:ListTagsForResource
                  - ssm:DescribeParameters
                  # SecureStrings under /five-crowns/* use the AWS-managed
                  # aws/ssm key. A customer-managed key would cost $1/month.
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:GenerateDataKey
                  - scheduler:*
                  - events:*
                  - route53:*
                  - acm:*
                  - apprunner:*
                  - ecr:*
                  - budgets:*
                Resource: "*"
              - Sid: IamScoped
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PassRole
                  # SST/Pulumi reads these while diffing an existing stack
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListRoleTags
                  - iam:UpdateAssumeRolePolicy
                  - iam:UntagRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${RepositoryName}-*
              # The server function sits behind CloudFront OAC with a
              # Lambda@Edge request signer (sst.config.ts `protection`).
              # Attaching an edge function needs Lambda's replication
              # service-linked role, which this account does not have yet.
              # Scoped to exactly that role.
              - Sid: LambdaEdgeReplicator
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/replicator.lambda.amazonaws.com/AWSServiceRoleForLambdaReplicator
                Condition:
                  StringEquals:
                    iam:AWSServiceName: replicator.lambda.amazonaws.com

Outputs:
  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN repo variable
    Value: !GetAtt DeployRole.Arn
  OIDCProvider:
    Description: Reuse this ARN for other repos in this account
    Value: !If
      - CreateOIDCProvider
      - !Ref GithubOidc
      - !Ref OIDCProviderArn
