name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI checks code, it never writes to the repo or reaches AWS.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs (tags can be moved).
      # To bump: gh api repos/<owner>/<repo>/git/ref/tags/<tag>, dereferencing
      # annotated tags, and update the SHA and the version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
